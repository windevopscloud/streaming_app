# Secrets Manager secrets that become files in the pod (/mnt/secrets-store/<alias>)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: streamnotify-secrets
  namespace: default
spec:
  provider: aws
  parameters:
    region: us-west-2
    objects: |
      - objectName: "ses/poc/smtp"
        objectType: "secretsmanager"
        jmesPath:
          - path: SMTP_USER
            objectAlias: smtp-user
          - path: SMTP_PASSWORD
            objectAlias: smtp-password
      - objectName: "streamnotify/poc/rds-app"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db-user
          - path: password
            objectAlias: db-password
      - objectName: "streamnotify/poc/app"
        objectType: "secretsmanager"
        jmesPath:
          - path: SECRET_KEY
            objectAlias: secret-key
          - path: PUBLISH_KEY
            objectAlias: publish-key
