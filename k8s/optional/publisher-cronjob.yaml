# Optional test publisher (not in kustomization): posts to topic "alerts" every minute.
# Apply by hand: kubectl apply -f k8s/optional/publisher-cronjob.yaml  (replace the image first)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: streamnotify-publisher
  namespace: default
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: streamnotify
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001}
          containers:
            - name: pub
              image: __REGISTRY__/streamnotify:__IMAGE_TAG__      # app image has python; no outside image needed
              command: ["python", "-c"]
              args:
                - |
                  import json, time, urllib.request
                  key = open("/mnt/secrets-store/publish-key").read().strip()
                  body = json.dumps({"topic": "alerts", "message": "Test event " + time.strftime("%H:%M:%S", time.gmtime())}).encode()
                  req = urllib.request.Request("http://streamnotify/api/publish", body,
                        {"X-Publish-Key": key, "Content-Type": "application/json"})
                  print(urllib.request.urlopen(req, timeout=10).read())
              volumeMounts:
                - {name: secrets, mountPath: /mnt/secrets-store, readOnly: true}
          volumes:
            - name: secrets
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: streamnotify-secrets
