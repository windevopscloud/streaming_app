# Test publisher: posts a sample event to topic "alerts" every minute.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: streamnotify-publisher
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pub
              image: curlimages/curl:8.10.1
              envFrom: [{secretRef: {name: streamnotify-secret}}]
              command: ["/bin/sh", "-c"]
              args:
                - >
                  curl -fsS -X POST http://streamnotify/api/publish
                  -H "X-Publish-Key: $PUBLISH_KEY" -H "Content-Type: application/json"
                  -d "{\"topic\":\"alerts\",\"message\":\"Test event $(date -u +%H:%M:%S)\"}"
